# GoReleaser configuration for sageox
# See https://goreleaser.com for documentation

version: 2

before:
  hooks:
    - go mod tidy

builds:
  # --- ox CLI (main binary) ---
  # Split per platform because signing ldflags differ per env var.

  - id: ox-linux-amd64
    main: ./cmd/ox
    binary: ox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/sageox/ox/internal/version.Version={{.Version}}
      - -X github.com/sageox/ox/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/sageox/ox/internal/version.BuildDate={{.Date}}
      - -X 'github.com/sageox/ox/internal/signing.EmbeddedPublicKey={{ .Env.SAGEOX_CLI_PUBLIC_KEY }}'
      - -X 'github.com/sageox/ox/internal/signing.EmbeddedSignatures={{ .Env.SAGEOX_CLI_SIGNATURES }}'

  - id: ox-linux-arm64
    main: ./cmd/ox
    binary: ox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X github.com/sageox/ox/internal/version.Version={{.Version}}
      - -X github.com/sageox/ox/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/sageox/ox/internal/version.BuildDate={{.Date}}
      - -X 'github.com/sageox/ox/internal/signing.EmbeddedPublicKey={{ .Env.SAGEOX_CLI_PUBLIC_KEY }}'
      - -X 'github.com/sageox/ox/internal/signing.EmbeddedSignatures={{ .Env.SAGEOX_CLI_SIGNATURES }}'

  - id: ox-darwin-amd64
    main: ./cmd/ox
    binary: ox
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/sageox/ox/internal/version.Version={{.Version}}
      - -X github.com/sageox/ox/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/sageox/ox/internal/version.BuildDate={{.Date}}
      - -X 'github.com/sageox/ox/internal/signing.EmbeddedPublicKey={{ .Env.SAGEOX_CLI_PUBLIC_KEY }}'
      - -X 'github.com/sageox/ox/internal/signing.EmbeddedSignatures={{ .Env.SAGEOX_CLI_SIGNATURES }}'

  - id: ox-darwin-arm64
    main: ./cmd/ox
    binary: ox
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X github.com/sageox/ox/internal/version.Version={{.Version}}
      - -X github.com/sageox/ox/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/sageox/ox/internal/version.BuildDate={{.Date}}
      - -X 'github.com/sageox/ox/internal/signing.EmbeddedPublicKey={{ .Env.SAGEOX_CLI_PUBLIC_KEY }}'
      - -X 'github.com/sageox/ox/internal/signing.EmbeddedSignatures={{ .Env.SAGEOX_CLI_SIGNATURES }}'

  - id: ox-freebsd-amd64
    main: ./cmd/ox
    binary: ox
    env:
      - CGO_ENABLED=0
    goos:
      - freebsd
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/sageox/ox/internal/version.Version={{.Version}}
      - -X github.com/sageox/ox/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/sageox/ox/internal/version.BuildDate={{.Date}}
      - -X 'github.com/sageox/ox/internal/signing.EmbeddedPublicKey={{ .Env.SAGEOX_CLI_PUBLIC_KEY }}'
      - -X 'github.com/sageox/ox/internal/signing.EmbeddedSignatures={{ .Env.SAGEOX_CLI_SIGNATURES }}'

  # --- Bundled adapters ---
  # Adapters don't need signing ldflags. They define their own version constants.
  # Note: ox-adapter-test is intentionally excluded (development/testing only).

  - id: ox-adapter-claude-code
    main: ./cmd/ox-adapter-claude-code
    binary: ox-adapter-claude-code
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w

  - id: ox-adapter-gemini
    main: ./cmd/ox-adapter-gemini
    binary: ox-adapter-gemini
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w

  - id: ox-adapter-codex
    main: ./cmd/ox-adapter-codex
    binary: ox-adapter-codex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w

  - id: ox-adapter-amp
    main: ./cmd/ox-adapter-amp
    binary: ox-adapter-amp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w

  - id: ox-adapter-opencode
    main: ./cmd/ox-adapter-opencode
    binary: ox-adapter-opencode
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w

  - id: ox-adapter-pi
    main: ./cmd/ox-adapter-pi
    binary: ox-adapter-pi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w

  - id: ox-adapter-aider
    main: ./cmd/ox-adapter-aider
    binary: ox-adapter-aider
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w

  - id: ox-adapter-droid
    main: ./cmd/ox-adapter-droid
    binary: ox-adapter-droid
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - id: ox-archive
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Changelog disabled - we use human-written release notes
# Auto-generated changelogs with commit hashes confuse users
changelog:
  disable: true

release:
  github:
    owner: sageox
    name: ox
  # Keep existing release notes written by humans
  # GoReleaser only uploads binaries, doesn't touch notes
  mode: keep
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## ox v{{.Version}}

    Pre-compiled binaries for Linux, macOS (Intel & Apple Silicon), and FreeBSD.

    Each tarball includes ox and bundled adapters (claude-code, gemini, codex, amp, opencode, pi, aider, droid).

    ### Installation

    **Quick Install (macOS/Linux/FreeBSD):**
    ```bash
    curl -sSL https://raw.githubusercontent.com/sageox/ox/main/scripts/install.sh | bash
    ```

    **Manual Install:**
    Download the appropriate binary for your platform below, extract it, and place it in your PATH.

brews:
  - name: ox
    repository:
      owner: sageox
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://sageox.ai"
    description: "The hivemind for agentic engineering"
    license: "Apache-2.0"
    test: |
      system "#{bin}/ox", "version"
    install: |
      bin.install "ox"
      bin.install "ox-adapter-claude-code"
      bin.install "ox-adapter-gemini"
      bin.install "ox-adapter-codex"
      bin.install "ox-adapter-amp"
      bin.install "ox-adapter-opencode"
      bin.install "ox-adapter-pi"
      bin.install "ox-adapter-aider"
      bin.install "ox-adapter-droid"

announce:
  skip: true
