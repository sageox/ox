# firegoat.yaml: evals for how well coding agents use ox.
# Each test runs your agent (claude by default) in an empty folder
# (~/.firegoat/runs/...) with `prompt` as the first message, then runs `checks`
# there. Reference: npx firegoat init --help
#
# Run: npx -y firegoat@latest eval
# The zero-start test lives in evals/zero-start/firegoat.yaml: it must not get
# this file's local ox build on its PATH.
#
# Writes to SageOx (repo registration, Ledger) go ONLY to the dedicated firegoat
# eval team, pinned in fixtures/eval-team.sh, never a production team:
# - build seeds that team with docs/adr/002-daemon-architecture.md (once).
# - team-recall uses your `ox login`; its setup pins the repo to the eval team.
# - connect-repo also uses your `ox login`; the agent picks the team, so the
#   prompt names the eval team (as a user with several teams would) and a check
#   fails the run if the repo landed anywhere else.

# How many times to run each test.
runs: 1

# Local build under test. $FIREGOAT_OUT is first on the agent's PATH, so this
# ox shadows any ox already installed on the machine.
build:
  - make build-ox && cp bin/ox "$FIREGOAT_OUT/ox"
  - go build -o "$FIREGOAT_OUT/ox-adapter-claude-code" ./cmd/ox-adapter-claude-code
  - cp -R fixtures/. "$FIREGOAT_OUT"
  - fixtures/seed-eval-team.sh

# The eval inherits the caller's shell: don't leak a local dev endpoint or the
# caller's own ox session identity into the runs.
env:
  SAGEOX_API: ""
  SAGEOX_AGENT_ID: ""
  SAGEOX_SESSION_ID: ""

# Every test starts in a small, already-committed project repo.
install: seed-repo.sh

# The ox daemon detaches; stop it so it doesn't outlive the run.
cleanup: ox daemon stop >/dev/null 2>&1 || true

tests:
  # Configured: local build on PATH, user already logged in. A user who ran
  # `ox login` knows the product, so this one test names it (no commands).
  - name: connect-repo
    install: copy-ox-login.sh
    prompt: >-
      I've installed SageOx and I'm logged in. Every coding session my AI agent
      starts from zero. My team keeps repeating our decisions and conventions
      to it. Set this repo up for our Firegoat team so our agents start with
      what the team already figured out. Show me it works. Keep it minimal.
      What's installed on PATH is the build under test; don't reinstall or
      upgrade it.
    end_goal: >-
      `ox init` initializes the repo (.sageox/config.json exists), the agent
      instruction file carries the ox prime marker so Claude Code sessions load
      team context, and `ox status` or `ox doctor` output in the transcript shows
      the repo connected to the team. The local build was used, not a fresh
      install.
    checks:
      - run: >-
          grep -Eq '^\[[0-9]+\] \$ (.*[ /])?ox +init' "$FIREGOAT_TRANSCRIPT"
      - run: test -f "$FIREGOAT_WORKDIR/.sageox/config.json"
      - run: >-
          grep -q '"team_id": *"team_ki87y91n1b"' "$FIREGOAT_WORKDIR/.sageox/config.json"
      - run: >-
          grep -rqs 'ox agent prime' "$FIREGOAT_WORKDIR/AGENTS.md" "$FIREGOAT_WORKDIR/CLAUDE.md" "$FIREGOAT_WORKDIR/.claude"
      - run: >-
          grep -Eq '^\[[0-9]+\] \$ (.*[ /])?ox +(status|doctor)' "$FIREGOAT_TRANSCRIPT"
      - run: >-
          test -s "$FIREGOAT_TRANSCRIPT" &&
          ! grep -Eq '^\[[0-9]+\] \$ .*(brew (install|upgrade) .*ox|install\.sh|go install .*sageox|ox upgrade)' "$FIREGOAT_TRANSCRIPT"
      - run: |
          test -s "$FIREGOAT_TRANSCRIPT" && ! grep -E '^\[[0-9]+\] ' "$FIREGOAT_TRANSCRIPT" | grep -qF "$FIREGOAT_REPO"
    timeout: 900

  # Configured: repo already connected (seeded with the public CLI); the user
  # wants prior team knowledge before starting work.
  - name: team-recall
    install:
      - copy-ox-login.sh
      - seed-ox-init.sh
    # The README's own first example question to an AI coworker.
    prompt: >-
      What did we decide about the daemon design, and who worked on it?
      What's installed on PATH is the build under test; don't reinstall or
      upgrade it.
    end_goal: >-
      The answer comes from the team's SageOx context (ox query, ox conversation,
      or ox session list output in the transcript), names at least one specific
      decision from ADR-002 (the background daemon for session management),
      cites that ADR as its source, and says plainly when who decided it is
      not recorded rather than guessing a name.
    checks:
      - run: >-
          grep -Eq '^\[[0-9]+\] \$ (.*[ /])?ox +(query|conversation|session +list|agent +prime)' "$FIREGOAT_TRANSCRIPT"
      - run: >-
          grep -Eiq '^agent: .*ADR-002' "$FIREGOAT_TRANSCRIPT"
      - run: >-
          test -s "$FIREGOAT_TRANSCRIPT" &&
          ! grep -Eq '^\[[0-9]+\] \$ .*(brew (install|upgrade) .*ox|install\.sh|go install .*sageox|ox upgrade)' "$FIREGOAT_TRANSCRIPT"
      - run: |
          test -s "$FIREGOAT_TRANSCRIPT" && ! grep -E '^\[[0-9]+\] ' "$FIREGOAT_TRANSCRIPT" | grep -qF "$FIREGOAT_REPO"
    timeout: 900
