name: Publish Docs

on:
  workflow_call:
    inputs:
      tag:
        description: 'Verified release tag (e.g., v0.8.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-docs:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Extract version from tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "::error::Invalid release tag: $RELEASE_TAG"; exit 1 ;;
          esac
          VERSION=${RELEASE_TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd docs && npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Generate docs
        run: go run ./cmd/ox docs --output docs/reference

      - name: Publish to GitHub Packages
        working-directory: docs
        run: npm publish
        env:
          # GITHUB_TOKEN works when @sageox/cli-docs grants this repository
          # Actions write access. DOCS_PACKAGE_TOKEN is the explicit fallback
          # for organizations that do not inherit package access from source.
          NODE_AUTH_TOKEN: ${{ secrets.DOCS_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}

  # Separate from publish-docs on purpose. DISPATCH_TOKEN can write to another
  # repository, so it lives in the release-docs environment (deployments limited
  # to main) instead of the repository secrets every branch's workflows can read.
  # This job never checks out the repository, so no repository code runs beside
  # the token. The ref check skips the job when release.yml is dispatched from
  # anywhere but main, even before the environment's branch policy exists.
  notify-docs-site:
    needs: publish-docs
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release-docs
    permissions: {}
    env:
      DISPATCH_TOKEN_SET: ${{ secrets.DISPATCH_TOKEN != '' }}
    steps:
      # The docs package is already published; a missing token only skips the
      # docs site refresh, so it warns instead of failing the release.
      - name: Report a missing dispatch token
        if: env.DISPATCH_TOKEN_SET != 'true'
        run: echo "::warning::DISPATCH_TOKEN is not set in the release-docs environment; the docs site was not notified."

      - name: Trigger docs site update
        if: env.DISPATCH_TOKEN_SET == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: sageox/sageox-monorepo
          event-type: cli-docs-updated
          client-payload: '{"version": "${{ needs.publish-docs.outputs.version }}"}'
