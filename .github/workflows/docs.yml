name: Publish Docs

on:
  workflow_call:
    inputs:
      tag:
        description: 'Verified release tag (e.g., v0.8.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Extract version from tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "::error::Invalid release tag: $RELEASE_TAG"; exit 1 ;;
          esac
          VERSION=${RELEASE_TAG#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd docs && npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Generate docs
        run: go run ./cmd/ox docs --output docs/reference

      - name: Publish to GitHub Packages
        working-directory: docs
        run: npm publish
        env:
          # GITHUB_TOKEN works when @sageox/cli-docs grants this repository
          # Actions write access. DOCS_PACKAGE_TOKEN is the explicit fallback
          # for organizations that do not inherit package access from source.
          NODE_AUTH_TOKEN: ${{ secrets.DOCS_PACKAGE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Trigger docs site update
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: sageox/sageox-monorepo
          event-type: cli-docs-updated
          client-payload: '{"version": "${{ env.VERSION }}"}'
