name: Coverage

# PRs are covered by the CI workflow's test job, which runs these same suites
# once, instrumented. This workflow is the main-branch baseline: CI on a push to
# main runs only the fast tier, so without a scheduled run nothing would measure
# coverage of main itself.
on:
  schedule:
    - cron: '0 11 * * *'  # daily at 3am Pacific / 11am UTC
  workflow_dispatch: {}   # allow manual trigger

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@sageox.ai"
          git config --global user.name "CI"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Full and compiled-binary suites with coverage
        run: TEST_JUNIT=junit.xml make coverage-integration

      - name: Require requested test artifact
        run: |
          test -s junit.xml
          python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("junit.xml").getroot(); assert any(root.iter("testcase")), "JUnit artifact has no test cases"'

      - name: Enforce risk-package coverage ratchets
        run: python3 scripts/coverage_ratchet.py coverage-all.out --require-provenance coverage-all.out.provenance.json

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: coverage-all.out
          flags: ox-cli
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Codecov deprecated test-results-action in favor of this action with
      # report_type: test_results; test-results-action has no node24 release.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
