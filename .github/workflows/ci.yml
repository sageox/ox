name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches, but NEVER on main: a push to main is
  # validating a merge, and cancelling it would leave the branch unverified.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changed-line coverage ratchet below diffs against the PR base
          # commit, which a shallow clone does not contain.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Cached explicitly below instead. setup-go derives its key from
          # go.sum and shares that one entry with the lint job; GitHub never
          # overwrites an existing key, so whichever job first missed it fixed
          # the contents for as long as go.sum holds. lint builds no test
          # binaries, so the entry this job restored carried no -race objects
          # and every run recompiled the race-instrumented stdlib and
          # dependencies before the first test ran (3m12s on run 35267514816).
          cache: false

      # This job is the sole writer of the shared Go cache. It builds the most
      # expensive variants (-race, -cover), so an entry it saves also serves
      # lint; the reverse is not true. Keep the key stable rather than rolling
      # it per run: the repo sits at ~9GB of its 10GB Actions cache budget, and
      # a fresh ~2.3GB build cache per run would evict the CodeQL and
      # golangci-lint entries and cost more than it saves.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@sageox.ai"
          git config --global user.name "CI"

      - name: Build
        run: go build -v ./...

      - name: Check generated CLI docs
        run: make docs-check

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      # Agent-friendly test output:
      #   --format pkgname-and-test-fails   only prints package names + failing tests
      #   --hide-summary skipped            collapses the skipped-test summary
      #   --format-hide-empty-pkg           hides packages with no test files
      #   --junitfile                       structured artifact for digest + post-mortem
      # Verbose mode (humans/local debugging): OX_TEST_LOG=1 + run gotestsum without
      # these flags, or call `make test` with V=1.
      - name: Fast tests
        if: github.event_name == 'push'
        run: |
          TEST_JUNIT=test-results.xml \
          TEST_TIMINGS=test-timings.json \
          make test

      - name: Test harness contracts
        run: make coverage-ratchet-test

      # Full unit tier, compiled-binary acceptance, and digital twins — one
      # instrumented pass. The Coverage workflow used to re-run these same three
      # suites in a parallel job purely to collect coverage, so every PR paid for
      # them twice (15m50s + 16m07s on run 35267514816). Instrumentation costs
      # ~15-20%; a second uninstrumented run cost 100%.
      - name: Full suites with coverage (PR gate)
        if: github.event_name == 'pull_request'
        run: |
          TEST_JUNIT=test-results.xml \
          TEST_TIMINGS=test-timings.json \
          make coverage-integration

      - name: Require requested test artifacts
        run: |
          test -s test-results.xml
          test -s test-timings.json
          python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("test-results.xml").getroot(); assert any(root.iter("testcase")), "JUnit artifact has no test cases"'
          python3 scripts/test_metrics.py test-timings.json >/dev/null

      - name: Enforce risk-package coverage ratchets
        if: github.event_name == 'pull_request'
        run: python3 scripts/coverage_ratchet.py coverage-all.out --require-provenance coverage-all.out.provenance.json

      - name: Enforce changed-line coverage
        if: github.event_name == 'pull_request'
        run: python3 scripts/coverage_ratchet.py coverage-all.out --require-provenance coverage-all.out.provenance.json --diff-base "${{ github.event.pull_request.base.sha }}"

      - name: Upload coverage
        if: always() && github.event_name == 'pull_request' && hashFiles('coverage-all.out') != ''
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: coverage-all.out
          flags: ox-cli
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Codecov deprecated test-results-action in favor of this action with
      # report_type: test_results; test-results-action has no node24 release.
      # PR-only, matching what the Coverage workflow uploaded: a push to main
      # runs the fast tier, and feeding that subset in would misrepresent which
      # tests ran.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('test-results.xml') != '' }}
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: test-results.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Failure digest
        if: always() && hashFiles('test-results.xml') != ''
        run: |
          python3 .github/scripts/junit_to_summary.py test-results.xml >> "$GITHUB_STEP_SUMMARY"
          if test -f test-timings.json; then
            python3 scripts/test_metrics.py --markdown test-timings.json >> "$GITHUB_STEP_SUMMARY" || echo "Test timing metrics unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JUnit results
        if: always() && hashFiles('test-results.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

      - name: Upload test timing events
        if: always() && hashFiles('test-timings.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timing-events
          path: test-timings.json
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      # Restore-only, on the key the test job owns. This job finishes in about a
      # minute, so under setup-go's shared cache it usually won the race to save
      # and pinned the entry to a lint build — no test binaries, no -race
      # objects — for as long as go.sum stayed put. Reading without writing keeps
      # one entry in the budget and lets the expensive job decide its contents.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: -c .config/golangci.yml

  # The skill installer is the one subsystem where Windows is a first-class
  # target rather than an aspiration: copy materialization IS what Windows gets,
  # because the symlink helper elsewhere in ox silently no-ops there. The
  # installer has ZERO GOOS branches today and is portable precisely because it
  # relies only on Lstat and rename — this job is what keeps that true, since a
  # regression would give Windows users no skills and no error.
  skills-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs no authenticated git operations, and a persisted
          # GITHUB_TOKEN in the local git config is readable by every later step.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@sageox.ai"
          git config --global user.name "CI"

      - name: Skill inventory tests
        run: go test ./internal/skillmanager/... ./internal/sageoxignore/... ./extensions/skills/... -count=1
