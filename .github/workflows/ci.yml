name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches, but NEVER on main: a push to main is
  # validating a merge, and cancelling it would leave the branch unverified.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # actions/cache waits this many minutes (default 10) for each 128 MiB piece
  # of a cache download, and a healthy piece takes about a second. A stalled
  # download then costs one minute, not ten, before the job carries on
  # without the cache.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
  # The full tier runs on Trunk's merge-queue candidates (pull_requests from
  # trunk-merge/* branches) and on every push to main. An author's own PR
  # pushes get the fast tier. Jobs read the result as needs.plan.outputs.tier.
  FULL_TIER: ${{ github.event_name == 'push' || startsWith(github.head_ref, 'trunk-merge/') }}

jobs:
  # Two tiers, each cut into slots (`make test-split-slots`, `make
  # test-fast-split-slots`):
  #
  #   fast  every push to a PR: lint plus the fast unit tier (-short), one
  #         runner per slot, no coverage. The goal is a verdict in under two
  #         minutes, so an author never waits on the expensive suites.
  #   full  each Trunk merge-queue candidate (trunk-merge/*): the full unit
  #         tier with coverage, acceptance, twins, plan-review, Windows, and
  #         the coverage ratchets. A failure drops the PR from the queue
  #         before it reaches main.
  #
  # Every push to main runs the full tier again, after the merge. Trunk can
  # merge an up-to-date PR into an empty queue without a queue run (Direct
  # Merge to Main), and a PR merged by hand skips the queue entirely; this
  # is what still checks those.
  #
  # The full tier used to run on every PR push, which made each push wait
  # 8-17 minutes for suites that only need to pass once, before merge.
  plan:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - id: tier
        run: echo "tier=$([ "$FULL_TIER" = true ] && echo full || echo fast)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git credentials; leaving the token in
          # .git/config would hand it to the test code this job runs.
          persist-credentials: false

      # The unit matrix is written out below so its runners start without
      # waiting for this job. This keeps it equal to the Makefile layouts
      # (`coverage-merge-unit` also refuses a missing full-tier slot).
      - name: Unit matrix matches the Makefile layouts
        run: |
          for target in test-split-slots test-fast-split-slots; do
            slots=$(make -s "$target")
            grep -qF "'$slots'" .github/workflows/ci.yml || { echo "::error::ci.yml unit matrix is missing $target: $slots"; exit 1; }
          done

      # CI tooling's own tests: off the fast path, before merge.
      - name: Test harness contracts
        if: steps.tier.outputs.tier == 'full'
        run: make coverage-ratchet-test

  unit:
    # 8 vCPU: go test -race -p 8 -parallel 32 per slot; ox-4 is the PR long pole (~1300s on 4 vCPU)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # Full tier (merge queue) first, fast tier second: `make -s
        # test-split-slots` and `make -s test-fast-split-slots`, checked by
        # the plan job. strategy cannot read env, hence the repeated test.
        slot: ${{ fromJSON((github.event_name == 'push' || startsWith(github.head_ref, 'trunk-merge/')) && '["rest", "heavy", "ox-1", "ox-2", "ox-3", "ox-4", "daemon-1", "daemon-2"]' || '["rest", "heavy", "ox-1", "ox-2", "ox-3", "ox-4", "ox-5", "daemon-1", "daemon-2"]') }}
    name: unit (${{ matrix.slot }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git credentials; leaving the token in
          # .git/config would hand it to the test code this job runs.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Cached explicitly below. setup-go derives its key from go.sum alone,
          # so the entry never refreshes between dependency bumps.
          cache: false

      # One build cache, written only by a push to main (the `main` job) and
      # read by every job. Keyed per commit so it tracks main; restore-keys
      # picks the newest. The legacy go.sum-keyed entry is the fallback until
      # the first main push lands.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-test-
            go-${{ runner.os }}-

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@sageox.ai"
          git config --global user.name "CI"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      # Agent-friendly test output:
      #   --format pkgname-and-test-fails   only prints package names + failing tests
      #   --hide-summary skipped            collapses the skipped-test summary
      #   --format-hide-empty-pkg           hides packages with no test files
      #   --junitfile                       structured artifact for digest + post-mortem
      # Verbose mode (humans/local debugging): OX_TEST_LOG=1 + run gotestsum without
      # these flags, or call `make test` with V=1.
      - name: ${{ env.FULL_TIER == 'true' && 'full' || 'fast' }} unit tier, slot ${{ matrix.slot }}
        env:
          TIER: ${{ env.FULL_TIER == 'true' && 'full' || 'fast' }}
        run: |
          target=test-fast-split-slot
          if [ "$TIER" = full ]; then target=test-split-slot; fi
          TEST_JUNIT=test-results.xml \
          TEST_TIMINGS=test-timings.json \
          make "$target" TEST_SPLIT_ONLY=${{ matrix.slot }}

      - name: Require requested test artifacts
        run: |
          test -s test-results.xml
          test -s test-timings.json
          python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("test-results.xml").getroot(); assert next(root.iter("testcase"), None) is not None, "JUnit artifact has no test cases"'
          python3 scripts/test_metrics.py test-timings.json >/dev/null

      - name: Upload unit coverage
        if: env.FULL_TIER == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-${{ matrix.slot }}
          path: tmp/unit-parts/coverage-${{ matrix.slot }}.out
          retention-days: 3
          overwrite: true

      # Codecov deprecated test-results-action in favor of this action with
      # report_type: test_results; test-results-action has no node24 release.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('test-results.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: test-results.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Failure digest
        if: always() && hashFiles('test-results.xml') != ''
        run: |
          python3 .github/scripts/junit_to_summary.py test-results.xml >> "$GITHUB_STEP_SUMMARY"
          if test -f test-timings.json; then
            python3 scripts/test_metrics.py --markdown test-timings.json >> "$GITHUB_STEP_SUMMARY" || echo "Test timing metrics unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JUnit results
        if: always() && hashFiles('test-results.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.slot }}
          path: test-results.xml
          retention-days: 14
          overwrite: true

      - name: Upload test timing events
        if: always() && hashFiles('test-timings.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timing-events-${{ matrix.slot }}
          path: test-timings.json
          retention-days: 14
          overwrite: true

  # A push to main runs the fast tier (its compile outputs are what the fast PR
  # slots restore), then compiles what full-tier jobs compile and saves it all
  # as the build cache every PR job restores. The full tier runs beside it.
  main:
    if: github.event_name == 'push'
    # 8 vCPU: push-to-main fast tier plus build-cache warm-up: Go compile and test, ~740s on 4 vCPU
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: write  # prune superseded build caches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git credentials; leaving the token in
          # .git/config would hand it to the test code this job runs.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-test-
            go-${{ runner.os }}-

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@sageox.ai"
          git config --global user.name "CI"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Fast tests
        run: |
          TEST_JUNIT=test-results.xml \
          TEST_TIMINGS=test-timings.json \
          make test

      - name: Test harness contracts
        run: make coverage-ratchet-test

      - name: Require requested test artifacts
        run: |
          test -s test-results.xml
          test -s test-timings.json
          python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("test-results.xml").getroot(); assert next(root.iter("testcase"), None) is not None, "JUnit artifact has no test cases"'
          python3 scripts/test_metrics.py test-timings.json >/dev/null

      - name: Failure digest
        if: always() && hashFiles('test-results.xml') != ''
        run: |
          python3 .github/scripts/junit_to_summary.py test-results.xml >> "$GITHUB_STEP_SUMMARY"
          if test -f test-timings.json; then
            python3 scripts/test_metrics.py --markdown test-timings.json >> "$GITHUB_STEP_SUMMARY" || echo "Test timing metrics unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JUnit results
        if: always() && hashFiles('test-results.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14
          overwrite: true

      - name: Upload test timing events
        if: always() && hashFiles('test-timings.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timing-events
          path: test-timings.json
          retention-days: 14
          overwrite: true

      - name: Warm the build cache for PRs
        run: make warm-test-cache

      # Drop what this run did not use. Go stamps a cache entry's mtime when it
      # uses one stamped over an hour ago, so with this job well under an hour,
      # an entry older than two hours went unused. Go's own trim is the same
      # rule at 5 days, under which restore-and-resave grew this cache to
      # ~6 GiB that every job spent ~2.5 minutes restoring.
      - name: Trim the build cache to what this run used
        run: find ~/.cache/go-build -mindepth 2 -maxdepth 2 -name '*-[ad]' -mmin +120 -exec rm -rf {} +

      - name: Save build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ github.sha }}

      # Keep the two newest entries. A PR job that picked the previous one may
      # still be downloading it, and deleting it mid-download fails that restore
      # ("The specified blob does not exist") and leaves the job compiling from
      # scratch. Two trimmed entries fit the repo's 10 GB Actions cache budget.
      - name: Prune superseded build caches
        env:
          GH_TOKEN: ${{ github.token }}
        # A cache listed here can be gone by the time it is deleted (GitHub
        # evicts caches on its own): gone is the goal, so only another error
        # fails the step.
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "go-${RUNNER_OS}-" \
            --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
            | while read -r id; do
                out=$(gh cache delete --repo "$GITHUB_REPOSITORY" "$id" 2>&1) && continue
                case "$out" in *"Could not find a cache"*) ;; *) echo "$out" >&2; exit 1 ;; esac
              done

  # Compiled-binary acceptance journeys through a coverage-instrumented ox.
  acceptance:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git credentials; leaving the token in
          # .git/config would hand it to the test code this job runs.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-test-
            go-${{ runner.os }}-

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@sageox.ai"
          git config --global user.name "CI"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Acceptance journeys with coverage
        run: make test-acceptance-cover coverage-integration-profile

      - name: Upload acceptance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-coverage
          path: |
            tmp/coverage/integration.out
            tmp/coverage/integration-test.out
            tmp/coverage/slow-test.out
          retention-days: 3
          overwrite: true

  # Deterministic cloud-auth, Ledger, and KB digital twins.
  twins:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git credentials; leaving the token in
          # .git/config would hand it to the test code this job runs.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-test-
            go-${{ runner.os }}-

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@sageox.ai"
          git config --global user.name "CI"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Digital twins with coverage
        run: make test-digital-twin-cover

      - name: Upload twin coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twins-coverage
          path: tmp/coverage/twins/*.out
          retention-days: 3
          overwrite: true

  # The single verdict for the workflow. `if: always()` matters: a job skipped
  # because a dependency failed reports as skipped, not failed, so without it a
  # red suite could leave this check looking green.
  #
  # `main`'s branch protection requires this check alone, and the Trunk merge
  # queue takes its required statuses from there. A job a merge must wait for
  # belongs in `needs` and in the tier's results below.
  test:
    if: always()
    needs: [plan, unit, main, acceptance, twins, lint, plan-review, skills-windows]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Require every suite to pass
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ needs.plan.outputs.tier }}
          PLAN: ${{ needs.plan.result }}
          UNIT: ${{ needs.unit.result }}
          MAIN: ${{ needs.main.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
          TWINS: ${{ needs.twins.result }}
          LINT: ${{ needs.lint.result }}
          PLAN_REVIEW: ${{ needs.plan-review.result }}
          SKILLS_WINDOWS: ${{ needs.skills-windows.result }}
        run: |
          echo "tier=$TIER plan=$PLAN unit=$UNIT main=$MAIN acceptance=$ACCEPTANCE twins=$TWINS lint=$LINT plan-review=$PLAN_REVIEW skills-windows=$SKILLS_WINDOWS"
          case "$TIER/$EVENT" in
            full/pull_request) results="$PLAN $UNIT $ACCEPTANCE $TWINS $LINT $PLAN_REVIEW $SKILLS_WINDOWS" ;;
            full/push) results="$PLAN $UNIT $ACCEPTANCE $TWINS $LINT $PLAN_REVIEW $SKILLS_WINDOWS $MAIN" ;;
            fast/pull_request) results="$PLAN $UNIT $LINT" ;;
            # no tier means plan failed: never a pass
            *) echo "::error::no test tier (plan=$PLAN)"; exit 1 ;;
          esac
          for result in $results; do test "$result" = success; done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.plan.outputs.tier == 'full'
        with:
          persist-credentials: false
          # The changed-line coverage ratchet below diffs against the PR base
          # commit (on main, the previous tip), which a shallow clone does not
          # contain.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.plan.outputs.tier == 'full'
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.tier == 'full'
        with:
          pattern: unit-coverage-*
          merge-multiple: true
          path: tmp/unit-parts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.tier == 'full'
        with:
          name: acceptance-coverage
          path: tmp/coverage

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.tier == 'full'
        with:
          name: twins-coverage
          path: tmp/coverage/twins

      - name: Merge coverage
        if: needs.plan.outputs.tier == 'full'
        run: |
          make coverage-merge-unit
          make coverage-merge

      - name: Enforce risk-package coverage ratchets
        if: needs.plan.outputs.tier == 'full'
        run: python3 scripts/coverage_ratchet.py coverage-all.out --require-provenance coverage-all.out.provenance.json

      - name: Enforce changed-line coverage
        if: needs.plan.outputs.tier == 'full'
        run: python3 scripts/coverage_ratchet.py coverage-all.out --require-provenance coverage-all.out.provenance.json --diff-base "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Upload coverage
        if: always() && needs.plan.outputs.tier == 'full' && hashFiles('coverage-all.out') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage-all.out
          flags: ox-cli
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    # 8 vCPU: on the fast path, and golangci-lint uses every core.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      # Restore-only, on the key the unit job writes from main. This job finishes
      # in about a minute, so under setup-go's shared cache it usually won the
      # race to save and pinned the entry to a lint build — no test binaries, no
      # -race objects. Reading without writing keeps one entry in the budget and
      # lets the expensive job decide its contents.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-test-
            go-${{ runner.os }}-

      # Moved here from the test job, which no longer needs a plain build: the
      # unit tier compiles every package anyway, and this job finishes first.
      # golangci-lint's typecheck catches a compile error on the fast path.
      - name: Build
        if: env.FULL_TIER == 'true'
        run: go build -v ./...

      # Match the FreeBSD release target and catch platform-specific imports.
      # A rare break that costs every PR push ~12s: checked before merge.
      - name: Cross-build FreeBSD CLI
        if: env.FULL_TIER == 'true'
        env:
          CGO_ENABLED: '0'
          GOOS: freebsd
          GOARCH: amd64
        run: go build -v -o /dev/null ./cmd/ox

      - name: Check generated CLI docs
        run: make docs-check

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.14.0+ bundles x/tools v0.50.0, the first to read the export data
          # Go 1.27.3 writes (version 5); older releases fail every typecheck.
          version: v2.14.0   # security-review.yml installs the same version for gosec
          args: -c .config/golangci.yml

  # @sageox/plan-review (packages/plan-review): the committed review assets in
  # internal/plan/assets match their TypeScript source, the package's tests
  # pass, and its tarball is reproducible, installs offline and type-checks.
  # Node only here: building ox needs none.
  plan-review:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check, test and pack the package
        run: make plan-review-check

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # The built package in real Chrome: the document tools against the
      # anchors Go computes for the same pages
      # (pkg/planreview/testdata/anchors.json), the review controls and
      # outbox, on ox's page and around a framed plan, drawings on the
      # drawn-context revisions, and live pointers between ox's page and a
      # framed plan. These tests skip without Chrome or dist/, so a skip has
      # to fail here.
      - name: Document tools anchor what Go anchors; the outbox sends once
        shell: bash
        env:
          # no session bus on the runner: Chrome fails fast instead of waiting on one
          DBUS_SESSION_BUS_ADDRESS: /dev/null
        run: |
          go test -tags=browser -count=1 -v -run 'TestBrowser_(DocumentToolsMatchSharedPageVectors|DocumentToolsAnchorADiagramOnceItDraws|ReviewClicksWaitForDiagrams|HostControlsAroundAFramedPlan|UnstorableReviewIsNeverSent|LostAnswerAndAnEditDuringSendDeliverOnce|TwoTabsKeepEachOthersMarks|ReopenedHighlightKeepsItsWords|PlanControlsWorkInReviewMode|ResolveOfferedOnlyToReviewersWhoMay|WholePlanCommentReachesTheLedger|NoteFromTheRailCoversNoComment|AutoSubmitPostsWhenTheReviewerIsDone|FirstVisitHintLeavesTheBarClickable|ReviewBarDrag|FramedControlsStayOverTheFrame|PlanCannotDriveTheComposer|LedgerTextCannotStyleOrScriptTheRail|DrawingsLandByTheirTargets|DrawAroundReachesTheHostStamped|ViewOriginalAfterAnEdit|ViewOriginalDrawsWordsWhereTheyWere|DrawingsStayIndependentThroughEditAndReopen|ForgedCapturesAreCheckedAndRestamped|DrawOnTheLocalReviewPage|DrawingNeverEnclosesTheReviewControls|SyncStatusTellsTheTruth|OvalsDrawMoveAndResize|OvalGeometryFreezesAtSubmit|LocalAndFramedReviewersSeeEachOthersPointers|PointerOnAnotherRevisionIsNeverDrawn|PointerMovesNeverOverlap|ChangingPlanIsNotRehashedEveryFrame)$' ./cmd/ox/ > browser.log 2>&1 || status=$?
          # -v output is kept in browser.log: dumped on failure, on a wrong pass count (skips exit 0), or under debug logging
          passed=$(grep -c -E '^--- PASS: TestBrowser_' browser.log || true)
          if [ "${status:-0}" -ne 0 ] || [ "$passed" -ne 33 ] || [ "${RUNNER_DEBUG:-}" = 1 ]; then cat browser.log; fi
          test "${status:-0}" -eq 0
          test "$passed" -eq 33
          echo "ok browser tests: $passed passed"

  # The skill installer is the one subsystem where Windows is a first-class
  # target rather than an aspiration: copy materialization IS what Windows gets,
  # because the symlink helper elsewhere in ox silently no-ops there. The
  # installer has ZERO GOOS branches today and is portable precisely because it
  # relies only on Lstat and rename — this job is what keeps that true, since a
  # regression would give Windows users no skills and no error.
  skills-windows:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs no authenticated git operations, and a persisted
          # GITHUB_TOKEN in the local git config is readable by every later step.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@sageox.ai"
          git config --global user.name "CI"

      - name: Skill inventory tests
        run: go test ./internal/skillmanager/... ./internal/sageoxignore/... ./extensions/skills/... -count=1

      # Markdown theming queried the console on a redirected stdin and hung forever on
      # Windows (#1110). macOS and Linux cannot reproduce it, so only this runner can
      # catch a regression; the timeout turns a hang into a fast, named failure.
      - name: Terminal UI tests
        run: go test ./internal/ui/... -count=1 -timeout 5m
