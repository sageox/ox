name: Security review

# Fast tier only (no AI tier — explicitly deferred)
# Runs deterministic OSS scanners on PRs that touch sensitive paths. Findings go to
# the job summary and the run's security-findings artifact, not the Security tab.
# Advisory only — never blocks merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Path-filter to gate the security jobs
  # =============================================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      sensitive: ${{ steps.filter.outputs.sensitive }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            sensitive:
              - 'security/rules/**'   # so an edited rule is parsed by the real scanner
              # so a change to the fast tier itself runs it
              - 'security/scripts/deterministic.sh'
              - 'security/scripts/pipeline.py'
              - 'security/scripts/install-bins.sh'
              - 'security/golangci-gosec.yml'
              - '.github/workflows/security-review.yml'
              - 'internal/auth/**'
              - 'internal/session/**'
              - 'internal/daemon/**'
              - 'cmd/ox/adapter.go'
              - 'cmd/ox/redaction.go'
              - 'go.mod'
              - 'go.sum'
            pipeline:
              - 'security/**'
              - '.claude/skills/security-review/**'
              - 'Makefile'   # the sec-test recipe
              - '.github/workflows/security-review.yml'

  # =============================================================================
  # The pipeline's own tests: fake claude + fake scanners, no network, no cost.
  # They prove a run reports what it reviewed — the diff reaches the hunters,
  # an empty review says NO COVERAGE, a failed scanner says failed.
  # =============================================================================
  pipeline-tests:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the security-review pipeline
        run: make sec-test

  # =============================================================================
  # Fast security job: run deterministic scanners only
  # =============================================================================
  security-fast:
    needs: changes
    # PRs only: on a push to main the diff vs origin/main is empty, so it scanned nothing.
    if: github.event_name == 'pull_request' && needs.changes.outputs.sensitive == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true   # never block merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need full history for diff

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # gosec runs through golangci-lint, which make sec-install does not install.
      # Same action and version as the lint job in ci.yml; move the two together.
      - name: Install golangci-lint for gosec
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          install-only: true

      - name: Cache security scanner binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/security-bin
          key: ox-security-bins-${{ hashFiles('security/scripts/install-bins.sh') }}

      - name: Install security scanners
        run: make sec-install
        env:
          OX_SECURITY_BIN_CACHE: ${{ runner.temp }}/security-bin

      - name: Run deterministic security scanners
        # `env.PATH` is not populated by GitHub Actions, so setting
        # `PATH: ${{ github.workspace }}/bin:${{ env.PATH }}` truncates to
        # `${workspace}/bin:` and drops /usr/bin (where `make` lives).
        # Extend PATH inside the shell instead.
        run: |
          export PATH="${GITHUB_WORKSPACE}/bin:${PATH}"
          make sec-fast

      - name: Write findings to the job summary
        if: always()
        run: |
          if [ -f security/.output/det-summary.md ]; then
            cat security/.output/det-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**NO COVERAGE**: the deterministic scan wrote no summary; see the step log above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload findings as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-findings-${{ github.run_id }}
          path: security/.output/
          include-hidden-files: true   # .output/ is a dot-directory, skipped by default
          retention-days: 14
