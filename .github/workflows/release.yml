name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.8.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  # Separate from verify-inrepo on purpose. Seeing a draft requires write:
  # GitHub hides draft releases from tokens without push access, and the
  # get-release-by-tag endpoint omits drafts for every token, so `gh release
  # view` only finds one via the list endpoint. This job never checks out the
  # repository, so the elevated token is never exposed to repository code --
  # actions/checkout persists it in git config, which would put a push-capable
  # credential inside `make test-release`.
  verify-draft:
    if: github.repository == 'sageox/ox'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      # actions: read lets the environment check below see deployment policies.
      actions: read
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Require immutable release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Release tags must start with v so the immutable release-tag ruleset applies."
            exit 1
          fi

          # Only main's reviewed copy of this workflow may run: the release
          # environments admit main alone, and a run from any other ref would
          # execute that ref's copy of this file.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch from main: gh workflow run release.yml --ref main -f tag=$RELEASE_TAG"
            exit 1
          fi

          rulesets=$(gh api "repos/$GITHUB_REPOSITORY/rulesets")
          ruleset_id=$(jq -r '
            [.[] | select(
              .name == "Immutable release tags" and
              .enforcement == "active"
            )][0].id // empty
          ' <<<"$rulesets")
          if [ -z "$ruleset_id" ]; then
            echo "::error::The active Immutable release tags ruleset is missing."
            exit 1
          fi

          ruleset=$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id")
          jq -e '
            .target == "tag" and
            .enforcement == "active" and
            .current_user_can_bypass == "never" and
            (.conditions.ref_name.include | index("refs/tags/v*")) != null and
            (.conditions.ref_name.exclude | length) == 0 and
            ([.rules[].type] | index("update")) != null and
            ([.rules[].type] | index("deletion")) != null
          ' <<<"$ruleset" >/dev/null || {
            echo "::error::The Immutable release tags ruleset must block this workflow from updating or deleting refs/tags/v*."
            exit 1
          }

      # The publishing credentials live in these environments. A job naming a
      # missing environment silently creates an unprotected one, so each
      # policy is checked, not assumed: deployments from branch main only.
      - name: Require main-only release environments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in cli-release npm; do
            environment=$(gh api "repos/$GITHUB_REPOSITORY/environments/$name") || {
              echo "::error::The $name environment is missing."
              exit 1
            }
            policies=$(gh api "repos/$GITHUB_REPOSITORY/environments/$name/deployment-branch-policies")
            jq -e '.deployment_branch_policy.custom_branch_policies == true and .deployment_branch_policy.protected_branches == false' <<<"$environment" >/dev/null &&
            jq -e '[.branch_policies[] | {type: (.type // "branch"), name}] == [{type: "branch", name: "main"}]' <<<"$policies" >/dev/null || {
              echo "::error::The $name environment must admit deployments from branch main only."
              exit 1
            }
          done

      - name: Require an existing human-reviewed draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft,name,tagName) || {
            echo "::error::Release $RELEASE_TAG must exist as a reviewed draft before dispatch."
            exit 1
          }
          jq -e --arg tag "$RELEASE_TAG" '
            .isDraft == true and
            .tagName == $tag and
            .name == $tag and
            (.databaseId | type == "number")
          ' <<<"$release" >/dev/null || {
            echo "::error::Release $RELEASE_TAG must be a reviewed draft whose name and tag are both $RELEASE_TAG."
            exit 1
          }
          echo "release_id=$(jq -r '.databaseId' <<<"$release")" >> "$GITHUB_OUTPUT"

  # Reads the release gate's stages from the Makefile at the tag, so the
  # verify-inrepo jobs run exactly the stages `make test-release` runs (and
  # verify-coverage its final stage), and records the commit the tag names so
  # every later job can refuse a moved tag.
  plan-release-stages:
    if: github.repository == 'sageox/ox'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
      final: ${{ steps.plan.outputs.final }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      # Parsing the Makefile runs `go env`; nothing is built here, so no module cache.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      # A stage is a plain target name, or target:slot for one slot of a split
      # tier: "-n" or "V=1" would let `make "$TARGET"` exit 0 without running
      # any tests.
      - name: Plan release stages
        id: plan
        run: |
          stages=$(make -s release-stages) || stages=""
          echo "Release stages: $stages"
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^[a-z][a-z0-9-]*(:[a-z0-9-]+)?$"))' <<<"$stages" >/dev/null || {
            echo "::error::make release-stages did not return a non-empty list of target[:slot] names. A tag cut before release stages existed cannot be released; release a new version from main."
            exit 1
          }
          final=$(make -s release-final-stage) || final=""
          echo "Final release stage: $final"
          [[ "$final" =~ ^[a-z][a-z0-9-]*$ ]] || {
            echo "::error::make release-final-stage did not return a target name. A tag cut before it existed cannot be released; release a new version from main."
            exit 1
          }
          {
            echo "stages=$stages"
            echo "final=$final"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  verify-inrepo:
    if: github.repository == 'sageox/ox'
    needs: [verify-draft, plan-release-stages]
    # 8 vCPU: stages run the -race suite at -p 8, one split slot per runner
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      # Every stage reports even when another fails, and re-running failed
      # jobs repeats only the stage that failed.
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(needs.plan-release-stages.outputs.stages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      # A re-run keeps the stages that passed, so a tag moved in between
      # would mix results from two commits.
      - name: Require the planned commit
        env:
          PLANNED_SHA: ${{ needs.plan-release-stages.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ -z "$PLANNED_SHA" ] || [ "$head" != "$PLANNED_SHA" ]; then
            echo "::error::$RELEASE_TAG names $head, but this release was planned for ${PLANNED_SHA:-no commit}. Dispatch the release again."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Under setup-go's shared entry the ~2-minute fuzz stage would save
          # first and pin the cache to a near-empty build. Read the entry
          # ci.yml's main job owns instead, without writing (restore below).
          cache: false

      # Same entry ci.yml's main job saves (keyed per commit, newest prefix
      # wins), restored without writing. Keyed on go.sum alone this job missed
      # every time and fetched ~200 modules and recompiled the -race build.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-test-
            go-${{ runner.os }}-

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@sageox.ai"
          git config --global user.name "CI"

      - name: Install pinned test runner
        run: go install gotest.tools/gotestsum@v1.13.0

      # "target" or "target:slot". Both come from the Makefile at the tag and
      # were checked by plan-release-stages; the slot reaches make as one
      # TEST_SPLIT_ONLY word, never through a shell expression.
      - name: Split stage
        id: stage
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          echo "target=${STAGE%%:*}" >> "$GITHUB_OUTPUT"
          slot=""
          case "$STAGE" in *:*) slot="${STAGE#*:}" ;; esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      # Each split slot has its own runner, as in PR CI: the slots' flags,
      # packages, and coverage gates are exactly `make test-release`'s, and a
      # slot that runs nothing fails.
      - name: Run release stage
        env:
          TARGET: ${{ steps.stage.outputs.target }}
          SLOT: ${{ steps.stage.outputs.slot }}
        run: |
          if [ -n "$SLOT" ]; then
            make "$TARGET" TEST_SPLIT_ONLY="$SLOT"
          else
            make "$TARGET"
          fi

      # Profiles the coverage stages write; verify-coverage merges them. A
      # missing file fails the upload rather than the merge, where the cause
      # is harder to see. retention-days: 3 on all three uploads: re-running
      # verify-coverage after the artifacts expire fails closed on the
      # download, so dispatch the release again instead.
      - name: Upload unit coverage
        if: steps.stage.outputs.target == 'test-release-unit'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-${{ steps.stage.outputs.slot }}
          path: tmp/unit-parts/coverage-${{ steps.stage.outputs.slot }}.out
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload acceptance coverage
        if: steps.stage.outputs.target == 'test-release-acceptance'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-coverage
          path: |
            tmp/coverage/integration.out
            tmp/coverage/integration-test.out
            tmp/coverage/slow-test.out
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload twins coverage
        if: steps.stage.outputs.target == 'test-release-twins'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twins-coverage
          path: tmp/coverage/twins/*.out
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # Runs the release gate's final stage over the coverage profiles the
  # verify-inrepo stages wrote: merge, then the same ratchets as before the
  # stages were split. Needs every stage to pass, so a failed or missing slot
  # leaves the release without a verdict instead of a partial one.
  verify-coverage:
    if: github.repository == 'sageox/ox'
    needs: [plan-release-stages, verify-inrepo]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Require the planned commit
        env:
          PLANNED_SHA: ${{ needs.plan-release-stages.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ -z "$PLANNED_SHA" ] || [ "$head" != "$PLANNED_SHA" ]; then
            echo "::error::$RELEASE_TAG names $head, but this release was planned for ${PLANNED_SHA:-no commit}. Dispatch the release again."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@sageox.ai"
          git config --global user.name "CI"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-coverage-*
          merge-multiple: true
          path: tmp/unit-parts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acceptance-coverage
          path: tmp/coverage

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: twins-coverage
          path: tmp/coverage/twins

      - name: Run final release stage
        env:
          FINAL_STAGE: ${{ needs.plan-release-stages.outputs.final }}
        run: make "$FINAL_STAGE"

  build-release-assets:
    if: github.repository == 'sageox/ox'
    needs: [verify-draft, verify-inrepo, verify-coverage, plan-release-stages]
    # SAGEOX_CLI_SIGNING_KEY lives in the cli-release environment, whose
    # deployment rules keep it from workflow runs on other branches. The
    # environment only sees the dispatch ref, so "Require the tagged commit
    # to be on main" below covers the code at the tag.
    environment: cli-release
    # 8 vCPU: goreleaser cross-compiles every platform binary, ~490s on 4 vCPU
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: write
    outputs:
      asset_names: ${{ steps.assets.outputs.asset_names }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      # Ship only the commit the verify-inrepo stages tested.
      - name: Require the planned commit
        env:
          PLANNED_SHA: ${{ needs.plan-release-stages.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ -z "$PLANNED_SHA" ] || [ "$head" != "$PLANNED_SHA" ]; then
            echo "::error::$RELEASE_TAG names $head, but this release was planned for ${PLANNED_SHA:-no commit}. Dispatch the release again."
            exit 1
          fi

      # The cli-release environment checks the ref the workflow was dispatched
      # from, not this tag. Without this step, a collaborator could tag an
      # unreviewed commit, dispatch from main, and run their own
      # scripts/sign-manifest with the signing key (Devin, veria-ai).
      - name: Require the tagged commit to be on main
        run: |
          # Fully qualified on purpose: fetch-depth 0 imports every tag, and a tag
          # named origin/main or main would win Git's short-name lookup over the
          # real branch (veria-ai).
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "::error::$RELEASE_TAG ($(git rev-parse --short HEAD)) is not on main. Only commits that landed on main are signed."
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Sign artifacts
        id: sign
        run: |
          # Expand the tag from the environment, not with a workflow expression:
          # expressions are pasted into the script text before bash runs, so a tag
          # named v$(...) would execute with the signing key in scope (veria-ai).
          echo "Signing artifacts for release $RELEASE_TAG..."

          # Sign all registered artifacts
          go run ./scripts/sign-manifest

          # Read the generated signatures
          public_key=$(jq -r '.public_key' .github/release-signatures.json)
          signatures=$(jq -r '[.signatures | to_entries[] | "\(.key):\(.value)"] | join(";")' .github/release-signatures.json)

          echo "SAGEOX_CLI_PUBLIC_KEY=$public_key" >> "$GITHUB_OUTPUT"
          echo "SAGEOX_CLI_SIGNATURES=$signatures" >> "$GITHUB_OUTPUT"

          # List signed artifacts for logs
          echo "Signed artifacts:"
          go run ./scripts/sign-manifest --list

          # sign-manifest rewrites the tracked .github/release-signatures.json with a
          # freshly-generated signature on every run. The values it produces are already
          # captured in $GITHUB_OUTPUT above and handed to GoReleaser via env-var ldflags,
          # so the on-disk file is only a record. Restore it to keep the working tree clean —
          # GoReleaser's `release --clean` aborts on a dirty git state (this silently broke
          # the v0.8.0, v0.8.1, and v0.9.0 artifact builds). See goreleaser.com/errors/dirty.
          git checkout -- .github/release-signatures.json
        env:
          SAGEOX_CLI_SIGNING_KEY: ${{ secrets.SAGEOX_CLI_SIGNING_KEY }}

      # Generate every release artifact, including the Homebrew formula, but
      # do not let GoReleaser choose or publish a release by name. The next
      # step uploads assets directly to the reviewed release ID.
      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release -f .config/goreleaser.yml --clean --skip=publish
        env:
          SAGEOX_CLI_PUBLIC_KEY: ${{ steps.sign.outputs.SAGEOX_CLI_PUBLIC_KEY }}
          SAGEOX_CLI_SIGNATURES: ${{ steps.sign.outputs.SAGEOX_CLI_SIGNATURES }}
          # PostHog project for CLI usage events (internal/telemetry/posthog.go).
          # A release built while these repository variables are unset sends nothing to PostHog.
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

      # Keep formula publication independently retryable after the release is
      # immutable. This artifact is private to the workflow run.
      - name: Save the Homebrew formula
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: dist/homebrew/ox.rb
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload assets to the approved draft
        id: assets
        env:
          APPROVED_RELEASE_ID: ${{ needs.verify-draft.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$APPROVED_RELEASE_ID" in
            ''|*[!0-9]*)
              echo "::error::The approved release ID is missing or invalid. Dispatch the release again."
              exit 1
              ;;
          esac

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$APPROVED_RELEASE_ID") || {
            echo "::error::The approved draft release no longer exists. Dispatch the release again."
            exit 1
          }
          jq -e --arg id "$APPROVED_RELEASE_ID" --arg tag "$RELEASE_TAG" '
            .id == ($id | tonumber) and
            .draft == true and
            .tag_name == $tag and
            .name == $tag
          ' <<<"$release" >/dev/null || {
            echo "::error::The approved draft changed. Nothing was uploaded."
            exit 1
          }

          jq -e '
            [.[] | select(.type == "Archive" or .type == "Checksum")] as $assets |
            ($assets | map(select(.type == "Archive")) | length) > 0 and
            ($assets | map(select(.type == "Checksum")) | length) == 1 and
            ($assets | map(.name) | length) == ($assets | map(.name) | unique | length) and
            all($assets[];
              (.name | type == "string" and test("^[A-Za-z0-9._-]+$")) and
              (.path | type == "string" and test("^dist/[A-Za-z0-9._/-]+$") and (contains("/../") | not))
            )
          ' dist/artifacts.json >/dev/null || {
            echo "::error::GoReleaser produced an invalid release-asset manifest."
            exit 1
          }

          mapfile -t assets < <(jq -r '
            .[] |
            select(.type == "Archive" or .type == "Checksum") |
            [.name, .path] | @tsv
          ' dist/artifacts.json)
          for entry in "${assets[@]}"; do
            IFS=$'\t' read -r name path <<<"$entry"
            if [ ! -f "$path" ]; then
              echo "::error::Release asset $path is missing."
              exit 1
            fi
            existing_id=$(jq -r --arg name "$name" '
              [.assets[]? | select(.name == $name)][0].id // empty
            ' <<<"$release")
            if [ -n "$existing_id" ]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id"
            fi
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$path" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$APPROVED_RELEASE_ID/assets?name=$name" \
              >/dev/null
          done
          echo "asset_names=$(jq -c '[.[] | select(.type == "Archive" or .type == "Checksum") | .name]' dist/artifacts.json)" >> "$GITHUB_OUTPUT"

  # This is intentionally a terminal, idempotent job. If GitHub publishes the
  # release but the API response is lost, a failed-job rerun verifies the exact
  # immutable release and succeeds without rebuilding or changing it.
  publish-release:
    if: github.repository == 'sageox/ox'
    needs: [verify-draft, plan-release-stages, build-release-assets]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Publish the approved draft
        env:
          APPROVED_RELEASE_ID: ${{ needs.verify-draft.outputs.release_id }}
          ASSET_NAMES: ${{ needs.build-release-assets.outputs.asset_names }}
          GH_TOKEN: ${{ github.token }}
          PLANNED_SHA: ${{ needs.plan-release-stages.outputs.sha }}
        run: |
          case "$APPROVED_RELEASE_ID" in
            ''|*[!0-9]*)
              echo "::error::The approved release ID is missing or invalid. Dispatch the release again."
              exit 1
              ;;
          esac
          jq -e '
            type == "array" and
            length > 0 and
            all(.[]; type == "string" and test("^[A-Za-z0-9._-]+$"))
          ' <<<"$ASSET_NAMES" >/dev/null || {
            echo "::error::The release asset list is missing or invalid."
            exit 1
          }

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$APPROVED_RELEASE_ID") || {
            echo "::error::The approved release no longer exists. Dispatch the release again."
            exit 1
          }
          jq -e --arg id "$APPROVED_RELEASE_ID" --arg tag "$RELEASE_TAG" '
            .id == ($id | tonumber) and
            .tag_name == $tag and
            .name == $tag and
            (
              (.draft == true and (.immutable // false) == false) or
              (.draft == false and .immutable == true)
            )
          ' <<<"$release" >/dev/null || {
            echo "::error::The approved release changed or was published without immutability."
            exit 1
          }

          while IFS= read -r name; do
            jq -e --arg name "$name" '
              any(.assets[]?; .name == $name and .state == "uploaded")
            ' <<<"$release" >/dev/null || {
              echo "::error::The approved release is missing $name."
              exit 1
            }
          done < <(jq -r '.[]' <<<"$ASSET_NAMES")

          remote_refs=$(git ls-remote --exit-code \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$RELEASE_TAG" \
            "refs/tags/$RELEASE_TAG^{}") || {
            echo "::error::Tag $RELEASE_TAG no longer exists."
            exit 1
          }
          remote_sha=$(awk '
            $2 ~ /\^\{\}$/ { peeled = $1; next }
            { direct = $1 }
            END { if (peeled != "") print peeled; else print direct }
          ' <<<"$remote_refs")
          if [ -z "$PLANNED_SHA" ] || [ "$remote_sha" != "$PLANNED_SHA" ]; then
            echo "::error::$RELEASE_TAG names ${remote_sha:-no commit}, but this release was tested at ${PLANNED_SHA:-no commit}."
            exit 1
          fi

          if [ "$(jq -r '.draft' <<<"$release")" = "false" ]; then
            exit 0
          fi

          published=$(gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$APPROVED_RELEASE_ID" \
            -F draft=false)
          jq -e --arg id "$APPROVED_RELEASE_ID" --arg tag "$RELEASE_TAG" '
            .id == ($id | tonumber) and
            .draft == false and
            .immutable == true and
            .tag_name == $tag and
            .name == $tag
          ' <<<"$published" >/dev/null || {
            echo "::error::GitHub did not make the approved release immutable."
            exit 1
          }

  # The formula must never advertise draft assets. Keeping this in its own job
  # lets a tap failure retry without rebuilding or changing the release.
  publish-homebrew:
    needs: [build-release-assets, publish-release]
    # HOMEBREW_TAP_GITHUB_TOKEN lives in the same environment as the signing key.
    environment: cli-release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name homebrew-formula \
            --dir homebrew

      - name: Publish the Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ ! -f homebrew/ox.rb ]; then
            echo "::error::The generated Homebrew formula is missing."
            exit 1
          fi

          current_sha=$(gh api repos/sageox/homebrew-tap/contents/ox.rb --jq .sha)
          content=$(base64 -w 0 homebrew/ox.rb)
          jq -n \
            --arg message "Brew formula update for ox version $RELEASE_TAG" \
            --arg content "$content" \
            --arg sha "$current_sha" \
            '{message: $message, content: $content, sha: $sha}' |
            gh api --method PUT repos/sageox/homebrew-tap/contents/ox.rb --input - >/dev/null

  # npm publishes the release's binaries as @sageox/ox. The job lives in its own
  # workflow so a release whose npm step failed can be published again by hand.
  publish-npm:
    needs: publish-release
    permissions:
      contents: read
      id-token: write # npm provenance
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  publish-docs:
    needs: publish-release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
