name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.8.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-and-release:
    if: github.repository == 'sageox/ox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Sign artifacts
        id: sign
        run: |
          echo "Signing artifacts for release ${{ env.RELEASE_TAG }}..."

          # Sign all registered artifacts
          go run ./scripts/sign-manifest

          # Read the generated signatures
          public_key=$(jq -r '.public_key' .github/release-signatures.json)
          signatures=$(jq -r '[.signatures | to_entries[] | "\(.key):\(.value)"] | join(";")' .github/release-signatures.json)

          echo "SAGEOX_CLI_PUBLIC_KEY=$public_key" >> $GITHUB_OUTPUT
          echo "SAGEOX_CLI_SIGNATURES=$signatures" >> $GITHUB_OUTPUT

          # List signed artifacts for logs
          echo "Signed artifacts:"
          go run ./scripts/sign-manifest --list

          # sign-manifest rewrites the tracked .github/release-signatures.json with a
          # freshly-generated signature on every run. The values it produces are already
          # captured in $GITHUB_OUTPUT above and handed to GoReleaser via env-var ldflags,
          # so the on-disk file is only a record. Restore it to keep the working tree clean —
          # GoReleaser's `release --clean` aborts on a dirty git state (this silently broke
          # the v0.8.0, v0.8.1, and v0.9.0 artifact builds). See goreleaser.com/errors/dirty.
          git checkout -- .github/release-signatures.json
        env:
          SAGEOX_CLI_SIGNING_KEY: ${{ secrets.SAGEOX_CLI_SIGNING_KEY }}

      - name: Build and upload binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release -f .config/goreleaser.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAGEOX_CLI_PUBLIC_KEY: ${{ steps.sign.outputs.SAGEOX_CLI_PUBLIC_KEY }}
          SAGEOX_CLI_SIGNATURES: ${{ steps.sign.outputs.SAGEOX_CLI_SIGNATURES }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Release ${{ env.RELEASE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Signed artifacts:**" >> $GITHUB_STEP_SUMMARY
          go run ./scripts/sign-manifest --list 2>/dev/null | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/sageox/ox/releases/tag/${{ env.RELEASE_TAG }})" >> $GITHUB_STEP_SUMMARY
        env:
          SAGEOX_CLI_SIGNING_KEY: ${{ secrets.SAGEOX_CLI_SIGNING_KEY }}

  # Publish the @sageox/ox npm wrapper. It downloads the SAME signed release
  # tarball that build-and-release just uploaded (verified via checksums.txt), so
  # it MUST run after that job — `needs` guarantees the assets exist first.
  publish-npm:
    name: Publish @sageox/ox to npm
    needs: build-and-release
    if: github.repository == 'sageox/ox'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance (SLSA build attestation)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish wrapper
        working-directory: npm
        env:
          # Publishing under the public @sageox scope requires the org to own that
          # scope on npmjs.org plus an NPM_TOKEN with publish rights. Until that is
          # set up this step no-ops cleanly instead of failing the release.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not set; skipping public npm publish."
            echo "Prerequisites: own the public @sageox scope on npmjs.org and add an"
            echo "NPM_TOKEN secret with publish rights. See npm/README.md."
            exit 0
          fi
          VERSION="${RELEASE_TAG#v}"
          # Pin the wrapper's version to the release tag so its postinstall fetches
          # the matching release assets.
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Prereleases (e.g. 1.2.0-rc.1) publish under the 'next' dist-tag so they
          # never become the default `npm install @sageox/ox` for everyone.
          if printf '%s' "$VERSION" | grep -q '-'; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          echo "Publishing @sageox/ox@$VERSION (dist-tag: $DIST_TAG)"
          npm publish --provenance --access public --tag "$DIST_TAG"
