name: Release Drift Check

# Never a pull_request/push gate: a version-bump PR legitimately precedes its
# release. This checks whether a bump that landed on main was ever actually
# tagged/published, and whether the latest release has binaries and is on
# Homebrew (see scripts/check-release-drift.sh).
on:
  schedule:
    - cron: '17 14 * * *'  # daily, off-peak UTC
  # release.yml publishes with its GITHUB_TOKEN, which triggers no workflows,
  # so this fires only for a release published some other way. That is how
  # v0.17.1 went out with no binaries.
  release:
    types: [published]
  workflow_dispatch: {}

# Serialize runs so two concurrent invocations can't both find no open
# drift issue and both create one.
concurrency:
  group: release-drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    if: github.repository == 'sageox/ox'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check for release drift
        id: drift
        run: |
          if OUTPUT=$(bash scripts/check-release-drift.sh --json); then
            STATUS=0
          else
            STATUS=$?
          fi

          echo "Raw output: $OUTPUT"

          # STATUS 0 = in sync, STATUS 1 = drift detected -- both are
          # expected outcomes handled below. STATUS >= 2 is a real script
          # error (bad gh auth, unparsable version.go, etc.) and should
          # fail loudly rather than being silently treated as "no drift".
          if [ "$STATUS" -ge 2 ]; then
            echo "::error::check-release-drift.sh errored (exit $STATUS): $OUTPUT"
            exit "$STATUS"
          fi

          CURRENT=$(echo "$OUTPUT" | jq -r '.current')
          # '// empty' so a null latest (no releases yet) doesn't become the
          # literal string "null" and get posted as "vnull" downstream.
          LATEST=$(echo "$OUTPUT" | jq -r '.latest // empty')
          DRIFT=$(echo "$OUTPUT" | jq -r '.drift')
          # The problem list is multi-line Markdown, so later steps read it
          # from this file rather than from a step output.
          echo "$OUTPUT" | jq -r '.problems | map("- " + .) | join("\n")' > "$RUNNER_TEMP/drift-problems.md"

          {
            echo "current=$CURRENT"
            echo "latest=$LATEST"
            echo "drift=$DRIFT"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure release-drift label exists
        if: steps.drift.outputs.drift == 'true'
        run: |
          # --force updates the description on the existing label.
          gh label create release-drift --force \
            --color B60205 \
            --description "The latest GitHub release is behind main, has no binaries, or is not on Homebrew" \
            --repo "$GITHUB_REPOSITORY" || true

      - name: Open or refresh drift tracking issue
        if: steps.drift.outputs.drift == 'true'
        env:
          # On a release event the actor is whoever published it.
          PUBLISHER: ${{ github.event_name == 'release' && github.actor || '' }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          PROBLEMS=$(cat "$RUNNER_TEMP/drift-problems.md")

          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label release-drift --state open --json number --jq '.[0].number // empty')

          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf 'Still drifted as of %s:\n\n%s\n' "$TODAY" "$PROBLEMS")"
          else
            # Built with printf (not a heredoc) so every line stays inside
            # this step's YAML block-scalar indentation.
            BODY=$(printf '%s\n' \
              "$PROBLEMS" \
              "" \
              "This issue was opened automatically by \`.github/workflows/release-drift.yml\` and will close automatically once every check passes.")

            URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Release drift detected" \
              --label release-drift \
              --body "$BODY")
            ISSUE=${URL##*/}
          fi

          # Assigned after creation so an unassignable actor cannot stop the
          # issue from being opened.
          if [ -n "$PUBLISHER" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-assignee "$PUBLISHER" || true
          fi

          echo "::error::Release drift detected; see the release-drift issue for what to fix"
          exit 1

      - name: Close stale drift issue
        if: steps.drift.outputs.drift == 'false'
        env:
          CURRENT: ${{ steps.drift.outputs.current }}
          LATEST: ${{ steps.drift.outputs.latest }}
        run: |
          for NUM in $(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label release-drift --state open --json number --jq '.[].number'); do
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" \
              --body "Resolved: every release check passes (version.go $CURRENT, latest release v$LATEST)."
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
          done
