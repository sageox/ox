    repo: sageox/ox
    capabilities: [session_reader, hook_installer, incremental_reader, serve_mode]
    detect_commands: [opencode]

  - name: pi
    display_name: Pi
    description: Reads Pi coding agent sessions, installs Pi hooks
    type: session
    bundled: true
    binary: ox-adapter-pi
    repo: sageox/ox
    capabilities: [session_reader, hook_installer, incremental_reader, file_watcher, serve_mode]
    detect_commands: [pi]

  - name: aider
    display_name: Aider
    description: Reads Aider sessions from markdown chat history
    type: session
    bundled: true
    binary: ox-adapter-aider
    repo: sageox/ox
    capabilities: [session_reader, hook_installer, incremental_reader, file_watcher, serve_mode]
    detect_commands: [aider]

  - name: droid
    display_name: Droid
    description: Reads Factory Droid sessions, installs Droid hooks and team rules
    type: session
    bundled: true
    binary: ox-adapter-droid
    repo: sageox/ox
    capabilities: [session_reader, hook_installer, rules_installer, incremental_reader, file_watcher, serve_mode, session_importer]
    detect_commands: [droid]

  # Goose declares no file_watcher: sessions live in SQLite behind a virtual
  # "goose:<id>" handle, so there is no path for fsnotify to watch.
  - name: goose
    display_name: Goose
    description: Reads Goose sessions from SQLite, installs Goose plugin hooks
    type: session
    bundled: true
    binary: ox-adapter-goose
    repo: sageox/ox
    capabilities: [session_reader, hook_installer, incremental_reader, serve_mode, session_importer, capture_prior]
    detect_commands: [goose]

  # --- External (non-bundled) adapters ---
  #
  # SECURITY (ADR-022, ox-5ihl): the short-name install path treats SageOx as the
  # trust anchor, so each external entry MUST pin a release `tag` and per-platform
  # `checksums` before `ox adapter install <name>` will run without friction.
  # Example:
  #     tag: v1.2.3
  #     checksums:
  #       darwin_arm64:  <sha256-hex>
  #       darwin_amd64:  <sha256-hex>
  #       linux_amd64:   <sha256-hex>
  # The sha256 is computed over the exact release asset for that platform.
  #
  # The entries below ship WITHOUT pins: no real binaries exist yet to checksum,
  # and fake checksums are worse than none. Until a maintainer adds real pins,
  # `ox adapter install <name>` for these FAILS CLOSED and requires
  # --allow-unverified. This is the intended, documented transition — populating
  # tag + checksums here restores frictionless install.
  - name: cursor
    display_name: Cursor
    description: Reads Cursor sessions
    type: session
    bundled: false
    binary: ox-adapter-cursor
    repo: sageox/ox-adapters
    capabilities: [session_reader, incremental_reader]
    detect_commands: [cursor]

  - name: windsurf
    display_name: Windsurf
    description: Reads Windsurf sessions
    type: session
    bundled: false
    binary: ox-adapter-windsurf
    repo: sageox/ox-adapters
    capabilities: [session_reader, incremental_reader]
    detect_commands: [windsurf]

  - name: copilot
    display_name: GitHub Copilot
    description: Reads Copilot sessions
    type: session
    bundled: false
    binary: ox-adapter-copilot
    repo: sageox/ox-adapters
    capabilities: [session_reader]
    detect_commands: [github-copilot-cli]


  - name: cline
    display_name: Cline
    description: Reads Cline sessions
    type: session
    bundled: false
    binary: ox-adapter-cline
    repo: sageox/ox-adapters
    capabilities: [session_reader]

community: []
