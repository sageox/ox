    binary: ox-adapter-amp
    repo: sageox/ox
    capabilities: [session_reader, hook_installer, incremental_reader, file_watcher, serve_mode]
    detect_commands: [amp]

  - name: opencode
    display_name: OpenCode
    description: Reads OpenCode sessions from SQLite, installs OpenCode hooks
    type: session
