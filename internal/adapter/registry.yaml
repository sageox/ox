schema_version: 1

adapters:
  - name: claude-code
    display_name: Claude Code
    description: Reads Claude Code sessions, installs Claude Code hooks
    type: session
    bundled: true
    binary: ox-adapter-claude-code
    repo: sageox/ox
    capabilities: [session_reader, hook_installer, incremental_reader, file_watcher, serve_mode]
    detect_commands: [claude]

  - name: gemini
    display_name: Gemini CLI
    description: Reads Gemini CLI sessions, installs Gemini hooks
