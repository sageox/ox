    capabilities: [session_reader, hook_installer, incremental_reader, file_watcher, serve_mode]
    detect_commands: [gemini]

  - name: codex
    display_name: OpenAI Codex CLI
    description: Reads Codex CLI sessions, installs Codex hooks
