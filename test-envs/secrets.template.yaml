# Template for test-envs/secrets.enc.yaml
#
# This file shows the structure of the encrypted secrets file.
# Do NOT commit this file with real keys filled in.
#
# To initialize the encrypted secrets file:
#   1. Copy this file:     cp secrets.template.yaml secrets.yaml
#   2. Fill in real keys:  $EDITOR secrets.yaml
#   3. Encrypt it:         sops -e secrets.yaml > secrets.enc.yaml
#   4. Remove plaintext:   rm secrets.yaml
#   5. Commit encrypted:   git add secrets.enc.yaml
#
# To edit existing encrypted secrets:
#   sops test-envs/secrets.enc.yaml
#
# Prerequisites:
#   export SOPS_AGE_KEY_FILE=~/.config/sageox/test-age-key.txt

api_keys:
  ANTHROPIC_API_KEY: "PLACEHOLDER_REPLACE_WITH_REAL_KEY"
  OPENAI_API_KEY: "PLACEHOLDER_REPLACE_WITH_REAL_KEY"
  GEMINI_API_KEY: "PLACEHOLDER_REPLACE_WITH_REAL_KEY"
  AMP_API_KEY: "PLACEHOLDER_REPLACE_WITH_REAL_KEY"
